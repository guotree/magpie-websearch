name: Publish to npm

# Normal release: bump the version, commit, tag v<version>, push the tag.
# The first publish is done by hand (see RELEASING.md); after that this
# workflow uses npm Trusted Publishing (OIDC), so there is no NPM_TOKEN.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm Trusted Publishing / provenance.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Never serve a cached install in a release build.
          package-manager-cache: false

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer, which the
      # runner's bundled npm may predate.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # A tag pushed without a matching version bump must fail here rather
      # than republish an existing version or publish the wrong one.
      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Check the plugin shape and run the tests
        run: npm run check

      - name: Check what npm would publish
        run: npm pack --dry-run

      - name: Publish
        # Trusted publishing authenticates with the OIDC token from
        # `id-token: write`; provenance is generated automatically.
        run: npm publish --provenance --access public
